allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# 安全修复：vite <= 6.4.2 存在 CVE-2026-53571(High) / CVE-2026-39365 / CVE-2026-53632；
# esbuild <= 0.24.2 存在 GHSA-67mh-4wv8-2f99。
# VitePress 1.6.4 声明 vite ^5.4.14（5.x 已无修复版本），故用 overrides 强制到已修复版本。
overrides:
  vite: ^6.4.3
  esbuild: ^0.25.0
  # dompurify 3.4.13~3.4.15 存在 GHSA-p98j-92pf-mc4p(Low)，由 mermaid 间接引入
  dompurify: ^3.4.16
  # source-map-js < 1.2.2 存在 CVE-2026-93749(High)，由 Vue compiler / postcss 间接引入
  source-map-js: ^1.2.2
